# Render Blueprint — defines the entire deploy declaratively.
# When you connect this repo to a new Blueprint on Render, this file is
# auto-detected and the service + database are created for you.
#
# Docs: https://render.com/docs/blueprint-spec

services:
  # Web service + managed Postgres. After the first deploy, set the secrets
  # marked sync:false in the Render dashboard (email, SMS, Stripe).
  - type: web
    name: starbase
    runtime: docker
    plan: starter              # always-on; volunteers canvass at all hours
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: starbase-db
          property: connectionString
      - key: STARBASE_PUBLIC_URL     # your public address, e.g. https://starbase.imaginesurrey.ca
        sync: false
      - key: RESEND_API_KEY          # email: newsletters, press, invites, shift alerts
        sync: false
      - key: MAIL_FROM               # e.g. Imagine Surrey <team@imaginesurrey.ca>
        sync: false
      - key: TWILIO_ACCOUNT_SID      # SMS shift alerts
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: STRIPE_SECRET_KEY       # card donations (leave unset to take pledges)
        sync: false
      - key: STRIPE_WEBHOOK_SECRET   # from the Stripe webhook pointing at /api/public/stripe/webhook
        sync: false
      - key: STARBASE_SITE_HOSTS     # the public website's domains, e.g. imaginesurrey.ca,www.imaginesurrey.ca
        sync: false
      - key: STARBASE_SERVE          # all (default) | app | site — see GOING-LIVE.md "One service or two"
        sync: false
      - key: GOOGLE_MAPS_SERVER_KEY  # optional: Google geocoding (GEOCODER=google / GEOCODER_FALLBACK=google) and map tiles (GOOGLE_MAPS_TILES=1)
        sync: false

  # The website as its own service, apart from the field app (same database):
  # uncomment, put the imaginesurrey.ca domains on it, point the Stripe
  # webhook at it, and set STARBASE_SERVE=app on the service above.
  # - type: web
  #   name: starbase-site
  #   runtime: docker
  #   plan: starter
  #   region: oregon
  #   dockerfilePath: ./Dockerfile
  #   dockerContext: .
  #   healthCheckPath: /api/health
  #   autoDeploy: true
  #   envVars:
  #     - key: NODE_ENV
  #       value: production
  #     - key: STARBASE_SERVE
  #       value: site
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: starbase-db
  #         property: connectionString
  #     - key: STARBASE_PUBLIC_URL
  #       sync: false
  #     - key: STRIPE_SECRET_KEY
  #       sync: false
  #     - key: STRIPE_WEBHOOK_SECRET
  #       sync: false

databases:
  - name: starbase-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"
